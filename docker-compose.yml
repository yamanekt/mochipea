services:
  app:
    build: .
    container_name: laravel_app
    working_dir: /var/www
    volumes:
      - ./src:/var/www
      - /var/www/vendor
    networks:
      - laravel

  web:
    image: nginx:alpine
    container_name: mochipea_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: mochipea_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mochipea
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

volumes:
  db_data:

networks:
  laravel: