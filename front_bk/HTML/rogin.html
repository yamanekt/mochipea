<!DOCTYPE html>
<html lang="ja">
 
<head>
    <meta charset="UTF-8">
  <title>ログイン</title>
  <link rel="stylesheet" href="../CSS/rogin.css">
  </head>
<body>
 
<div class="container">
  <h2>サインイン</h2>
 
  <form id="loginForm" action="home.html">
    <div class="input-group">
        <label for="userId">Eメール</label>
        <input type="email" id="userId" required>
    </div>

    <div class="input-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" required>
    </div>

    <p class="error" id="errorMsg"></p>

    <button type="submit">ログイン</button>
</form>

    <!-- 新規登録 -->
    <p class="register-link">
        初めての方はこちら
        <a href="register.html">新規登録</a>
    </p>
  
    </a>
</div>
</body>
</html>
