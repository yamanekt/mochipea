<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title></title>
  <link rel="stylesheet" href="../CSS/make.css">
</head>
<body>
  <div class="bg"></div>
  <div class="container">
    <h1>ルーム作成</h1>
    <h2>パスワード設定</h2>
    

<label>4桁のパスワード *</label>

<div class="password-area">
    <input type="text" id="roomNumber" name="roomNumber" readonly required>

    <button type="button" class="generate-btn" onclick="generatePassword()">
        自動生成
    </button>
</div>

<a href="goals.html" class="main-btn">ルーム作成</a>

<script>
function generatePassword() {
    const password = Math.floor(1000 + Math.random() * 9000);
    document.getElementById("roomNumber").value = password;
}
</script>
  </div>
  
</body>
</html>
